<form class="contact-form" action="{% url 'contact_api' %}" method="post">
{% csrf_token %}<div class="form-row"><div class="field"><label for="contact-name">Your name *</label><input id="contact-name" name="name" autocomplete="name" required minlength="2" maxlength="100" placeholder="Alex, for example"><span class="field-error" data-error="name" id="error-name"></span></div><div class="field"><label for="contact-email">Email address *</label><input type="email" id="contact-email" name="email" autocomplete="email" required maxlength="254" placeholder="you@yourstudio.com"><span class="field-error" data-error="email" id="error-email"></span></div></div>
<div class="form-row"><div class="field"><label for="contact-subject">What are you thinking? *</label><input id="contact-subject" name="subject" required maxlength="160" placeholder="A brand, a website, something new…"><span class="field-error" data-error="subject" id="error-subject"></span></div><div class="field"><label for="contact-budget">Your budget</label><select id="contact-budget" name="budget"><option value="">Select a range</option>$2,000 – $5,000</option><option>$5,000 – $10,000</option><option>$10,000 – $20,000</option><option>$20,000+</option><option>Let’s discuss</option></select></div></div>
<div class="field"><label for="contact-message">A little about your project *</label><textarea id="contact-message" name="message" rows="3" minlength="20" maxlength="5000" required placeholder="The big idea, the challenge, the dream…"></textarea><span class="field-error" data-error="message" id="error-message"></span></div>
<div class="honeypot" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<div class="form-submit"><span>Your next good thing starts here.</span><button class="pill-button" type="submit">Send message <span>↗</span></button></div><p class="form-status" role="status" aria-live="polite" tabindex="-1"></p>
</form>
