<article class="post-card"><a href="{{ post.get_absolute_url }}" class="post-art post-art-{{ forloop.counter }}" aria-label="Read {{ post.title }}">{% if post.cover_image %}<img src="{{ post.cover_image.url }}" alt="" loading="lazy">{% else %}<span class="post-symbol">{% cycle '✳' '↗' '◒' %}</span><span class="post-art-label">NOTES FROM THE STUDIO / {{ forloop.counter|stringformat:'02d' }}</span>{% endif %}</a><div class="post-meta">{{ post.tags }} <span>·</span> {{ post.reading_time }} MIN READ</div><h3><a href="{{ post.get_absolute_url }}">{{ post.title }} <span>↗</span></a></h3><p>{{ post.excerpt }}</p></article>
